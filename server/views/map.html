<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrocław Public Transport Live Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #121212;
            height: 100vh;
            overflow: hidden;
            color: #FFFFFF;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 380px;
            background: linear-gradient(145deg, #1e1e1e 0%, #2a2a2a 100%);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.3);
        }

        .header {
            padding: 25px 20px;
            background: linear-gradient(135deg, #0075FF 0%, #4A90E2 100%);
            color: white;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            opacity: 0.9;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .stats {
            padding: 25px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-card {
            background: linear-gradient(145deg, #2a2a2a 0%, #1e1e1e 100%);
            padding: 20px 15px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            color: #0075FF;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0, 117, 255, 0.3);
        }

        .stat-label {
            font-size: 0.85rem;
            color: #E0E0E0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .filters {
            padding: 25px 20px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .filters::-webkit-scrollbar {
            width: 6px;
        }

        .filters::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .filters::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .category-container {
            margin-bottom: 30px;
        }

        .category-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #E0E0E0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .lines-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-start;
        }

        .line-button {
            min-width: 50px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            border: 2px solid transparent;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .line-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .line-button:hover::before {
            opacity: 1;
        }

        .line-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .line-button.selected {
            border-color: #BB86FC;
            box-shadow: 0 0 0 2px #BB86FC, 0 4px 15px rgba(187, 134, 252, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { 
                box-shadow: 0 0 0 2px #BB86FC, 0 4px 15px rgba(187, 134, 252, 0.3);
            }
            50% { 
                box-shadow: 0 0 0 4px rgba(187, 134, 252, 0.5), 0 4px 20px rgba(187, 134, 252, 0.4);
            }
        }

        .alerts {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            max-height: 42vh;
            overflow-y: auto;
            padding: 14px 20px 4px;
        }

        .alerts-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
            margin-bottom: 10px;
        }

        .alerts-count {
            background: #C2410C;
            color: #fff;
            border-radius: 999px;
            padding: 1px 8px;
            font-size: 0.72rem;
        }

        .alerts-count.zero { background: rgba(255, 255, 255, 0.12); }

        .alert-item {
            display: block;
            text-decoration: none;
            color: inherit;
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid transparent;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }

        .alert-item:hover { background: rgba(255, 255, 255, 0.09); }

        /* Anything touching a line you have on screen is why you looked. */
        .alert-item.relevant { border-left-color: #C2410C; }

        .alert-title {
            font-size: 0.86rem;
            font-weight: 600;
            color: #fff;
            line-height: 1.35;
        }

        .alert-meta {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.45);
            margin-top: 4px;
        }

        .alert-lines {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 8px;
        }

        .alert-line {
            font-size: 0.7rem;
            font-weight: 700;
            color: #fff;
            border-radius: 4px;
            padding: 1px 6px;
        }

        .alerts-empty {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.45);
            padding-bottom: 10px;
        }

        .last-update {
            padding: 20px;
            background: linear-gradient(145deg, #1a1a1a 0%, #0d0d0d 100%);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
            color: #B0B0B0;
            text-align: center;
        }

        .update-time {
            font-weight: 700;
            color: #0075FF;
        }

        #map {
            flex-grow: 1;
            position: relative;
            background: #1a1a1a;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(145deg, #2a2a2a 0%, #1e1e1e 100%);
            color: white;
            padding: 25px 35px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid #0075FF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Vehicle markers: the line badge, plus a tip pointing the way it is
           travelling. The arrow sits in a full-size box that is what actually
           rotates, so it orbits the badge instead of spinning in place. */
        .vehicle-pin {
            position: relative;
            width: 40px;
            height: 40px;
        }

        .vehicle-badge {
            position: absolute;
            inset: 4px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 12px;
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        .vehicle-pin.selected .vehicle-badge {
            border-color: #fff;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.35), 0 4px 14px rgba(0, 0, 0, 0.55);
        }

        /* Wider than the pin on purpose: the tip has to clear the badge it
           orbits, or it hides behind its own shadow. */
        .vehicle-arrow {
            position: absolute;
            inset: -8px;
        }

        .vehicle-arrow::before,
        .vehicle-arrow::after {
            content: '';
            position: absolute;
            left: 50%;
            width: 0;
            height: 0;
            border-style: solid;
            border-color: transparent;
        }

        /* White behind, the line's colour on top — the same reason the badge
           has a white hairline: a coloured arrow on its own disappears over a
           road drawn in roughly that colour. */
        .vehicle-arrow::before {
            top: -2px;
            margin-left: -6.5px;
            border-width: 0 6.5px 11px;
            border-bottom-color: rgba(255, 255, 255, 0.92);
        }

        .vehicle-arrow::after {
            top: -1px;
            margin-left: -5px;
            border-width: 0 5px 9px;
            border-bottom-color: currentColor;
        }

        .vehicle-tooltip {
            background: #1e1e1e;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            font-size: 0.8rem;
            padding: 4px 8px;
        }

        .vehicle-tooltip::before { border-top-color: #1e1e1e; }

        .route-info {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            max-width: calc(100% - 40px);
            background: linear-gradient(145deg, #2a2a2a 0%, #1e1e1e 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            z-index: 999;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
        }

        .route-info.visible {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .route-info h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
        }

        .route-info p {
            margin: 0;
            font-size: 0.85rem;
            color: #B0B0B0;
        }

        /* The selected vehicle: where it is going, and the stops it has left.
           Sized so a long route scrolls inside the panel rather than running
           off the bottom of the map. */
        .route-head {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-right: 20px;
        }

        .route-badge {
            color: #fff;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.95rem;
            flex: none;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        /* The panel carries the line's colour so the stop dots can inherit it;
           everything with words in it says its own colour, or the whole card
           turns into one long stretch of line blue. */
        .route-status {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 10px;
            font-size: 0.8rem;
            color: #fff;
        }

        .route-status .muted { color: #B0B0B0; }
        .route-status .warn { color: #FFB020; font-weight: 600; }

        .route-stops {
            margin-top: 10px;
            max-height: 320px;
            overflow-y: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stop-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .stop-row:last-child { border-bottom: none; }
        .stop-row.passed { opacity: 0.5; }

        .stop-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: currentColor;
            flex: none;
        }

        .stop-row.passed .stop-dot {
            background: transparent;
            border: 2px solid currentColor;
        }

        .stop-name {
            flex: 1;
            color: #fff;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stop-name i {
            display: block;
            font-style: normal;
            font-size: 0.7rem;
            color: #B0B0B0;
            font-variant-numeric: tabular-nums;
        }

        /* Amber is the countdown, and only the countdown. */
        .stop-eta {
            font-weight: 700;
            font-size: 1rem;
            color: #FFB020;
            font-variant-numeric: tabular-nums;
        }

        .stop-eta i {
            font-style: normal;
            font-size: 0.7rem;
            opacity: 0.75;
            margin-left: 2px;
        }

        .stop-ago, .route-empty {
            font-size: 0.75rem;
            color: #B0B0B0;
        }

        .route-empty { padding: 12px 2px; }

        .close-route {
            position: absolute;
            top: 8px;
            right: 12px;
            background: none;
            border: none;
            color: #B0B0B0;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-route:hover {
            color: white;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: absolute;
                height: 60vh;
                z-index: 1001;
                overflow: hidden;
            }

            .container {
                flex-direction: column;
            }

            /* The sidebar owns the top 60% of a phone screen, so the panel
               goes to the bottom — where a sheet belongs anyway — instead of
               sitting underneath it. */
            .route-info {
                top: auto;
                bottom: 10px;
                left: 10px;
                right: 10px;
                width: auto;
                max-width: none;
                /* The map is only the 40% of the screen the sidebar leaves;
                   the panel has to fit inside that, not reach up behind it. */
                max-height: calc(40vh - 20px);
                overflow: hidden;
            }

            .route-stops {
                max-height: calc(40vh - 150px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="header">
                <h1>🚋 Wrocław Transit</h1>
                <p>Live vehicle tracking system</p>
            </div>
            
            <div class="stats">
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="tramCount">0</div>
                        <div class="stat-label">Tramwaje</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="busCount">0</div>
                        <div class="stat-label">Autobusy</div>
                    </div>
                </div>
            </div>

            <div class="filters" id="filtersContainer">
                <!-- Categories will be populated dynamically -->
            </div>

            <div class="alerts" id="alertsPanel">
                <div class="alerts-header">
                    <span>Komunikaty</span>
                    <span class="alerts-count zero" id="alertsCount">0</span>
                </div>
                <div id="alertsList"></div>
            </div>

            <div class="last-update">
                Ostatnia aktualizacja: <span class="update-time" id="lastUpdate">Nigdy</span>
            </div>
        </div>

        <div id="map">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <span>Ładowanie pojazdów...</span>
            </div>
            
            <div class="route-info" id="routeInfo">
                <button class="close-route" onclick="clearSelection()">×</button>
                <div class="route-head">
                    <div class="route-badge" id="routeBadge">4</div>
                    <div>
                        <h3 id="routeTitle">Linia X</h3>
                        <p id="routeType">Typ pojazdu</p>
                    </div>
                </div>
                <div class="route-status" id="routeStatus"></div>
                <div class="route-stops" id="routeStops"></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    
    <script>
        // Anything that reaches innerHTML goes through this: line names, stop
        // names and alert text all come from upstream feeds, not from us.
        function escapeHtml(value) {
            return String(value ?? '').replace(/[<>&"]/g, (c) =>
                ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
        }

        // Colors matching your React Native app
        const Colors = {
            tram: "#0075FF",
            tramSpecial: "#50E3C2", 
            tramTemporary: "#F8E71C",
            bus: "#E85D75",
            busSpecial: "#F5A623",
            busNight: "#9013FE",
            busTemporary: "#B8E986", 
            busSuburban: "#7ED321",
            busZone: "#F8E71C",
            busExpress: "#F5A623",
            unknown: "#D0021B"
        };

        // Translations matching your React Native app
        const translations = {
            tram: { name: "Tramwaje", color: "#0075FF" },
            tramSpecial: { name: "Tramwaje Specjalne", color: "#50E3C2" },
            tramTemporary: { name: "Tramwaje Tymczasowe", color: "#F8E71C" },
            bus: { name: "Autobusy", color: "#E85D75" },
            busNight: { name: "Autobusy Nocne", color: "#9013FE" },
            busSuburban: { name: "Autobusy Podmiejskie", color: "#7ED321" },
            busTemporary: { name: "Autobusy Tymczasowe", color: "#B8E986" },
            busZone: { name: "Autobusy Strefowe", color: "#F8E71C" },
            busExpress: { name: "Autobusy Ekspresowe", color: "#F5A623" },
            busSpecial: { name: "Autobusy Specjalne", color: "#D0021B" },
            unknown: { name: "Nieznane", color: "#D0021B" }
        };

        // Initialize map centered on Wrocław with dark theme
        const map = L.map('map', {
            center: [51.1079, 17.0385],
            zoom: 12,
            zoomControl: true,
            attributionControl: false
        });
        
        // Add dark theme map tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap contributors, © CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // Store markers, routes, and current selections
        /** @type {Map<string, {marker: L.Marker, look: string}>} vehicle id -> marker */
        const vehicleMarkers = new Map();
        let selectedLines = [];
        let vehicleData = [];
        let currentRoute = null;
        /** The drawn route's layers, so progress along it can be updated in place. */
        let routeLayers = null;
        /** The vehicle being followed: { id, line, type, shapeId, trip, stale }. */
        let selection = null;

        // Create custom vehicle marker
        function vehicleIcon(vehicle, selected) {
            const colour = Colors[vehicle.type] || Colors.unknown;
            // No heading until a vehicle has visibly moved, so the arrow is
            // omitted rather than pointed at an arbitrary north.
            const arrow = Number.isFinite(vehicle.heading)
                ? `<div class="vehicle-arrow" style="color:${colour}; transform: rotate(${Math.round(vehicle.heading)}deg)"></div>`
                : '';

            return L.divIcon({
                html: `<div class="vehicle-pin${selected ? ' selected' : ''}">${arrow}` +
                    `<div class="vehicle-badge" style="background:${colour}">${escapeHtml(vehicle.line)}</div></div>`,
                className: 'custom-vehicle-icon',
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            });
        }

        function vehicleTooltip(vehicle) {
            const towards = vehicle.trip?.towards || vehicle.trip?.headsign;
            const tail = towards
                ? '→ ' + escapeHtml(towards)
                : escapeHtml(translations[vehicle.type]?.name || vehicle.type);
            return '<strong>' + escapeHtml(vehicle.line) + '</strong> ' + tail;
        }

        function visibleVehicles() {
            return selectedLines.length === 0
                ? vehicleData
                : vehicleData.filter(vehicle => selectedLines.includes(vehicle.line));
        }

        /**
         * Bring the markers in line with the latest positions.
         *
         * Markers are moved, not rebuilt. Clearing the layer and recreating
         * every marker each poll made the whole fleet blink every ten seconds,
         * closed whatever was open, and dropped the selection ring — and it
         * costs more, not less, than moving the ones that are already there.
         */
        function renderVehicles() {
            const wanted = new Map(visibleVehicles().map(vehicle => [vehicle.id, vehicle]));

            for (const [id, entry] of vehicleMarkers) {
                if (wanted.has(id)) continue;
                map.removeLayer(entry.marker);
                vehicleMarkers.delete(id);
            }

            for (const [id, vehicle] of wanted) {
                const selected = selection?.id === id;
                // Heading is bucketed: a marker redrawn for every degree of
                // GPS jitter is a marker redrawn constantly.
                const look = [vehicle.line, vehicle.type, Math.round((vehicle.heading ?? -1) / 15), selected].join('|');
                const existing = vehicleMarkers.get(id);

                if (existing) {
                    existing.marker.setLatLng([vehicle.lat, vehicle.lon]);
                    existing.marker.setTooltipContent(vehicleTooltip(vehicle));
                    if (existing.look !== look) {
                        existing.marker.setIcon(vehicleIcon(vehicle, selected));
                        existing.marker.setZIndexOffset(selected ? 1000 : 0);
                        existing.look = look;
                    }
                    continue;
                }

                const marker = L.marker([vehicle.lat, vehicle.lon], {
                    icon: vehicleIcon(vehicle, selected),
                    zIndexOffset: selected ? 1000 : 0
                })
                    .bindTooltip(vehicleTooltip(vehicle), {
                        direction: 'top',
                        offset: [0, -14],
                        className: 'vehicle-tooltip'
                    })
                    // By id, not by this object: the vehicle is looked up again
                    // on click, so the route is drawn from where it is now and
                    // not from where it was when the marker was created.
                    .on('click', () => selectVehicle(id));

                marker.addTo(map);
                vehicleMarkers.set(id, { marker, look });
            }

            updateStats();
        }

        /** Follow a vehicle: draw the direction it is running and list its stops. */
        async function selectVehicle(id) {
            if (selection?.id === id) {
                clearSelection();
                return;
            }

            const vehicle = vehicleData.find(entry => entry.id === id);
            if (!vehicle) return;

            selection = { id, line: vehicle.line, type: vehicle.type, shapeId: null, trip: null, stale: false };
            renderVehicles();
            renderVehiclePanel();

            await drawRoute(vehicle);
            await refreshTrip();
        }

        function clearSelection() {
            selection = null;
            hideRoute();
            renderVehicles();
            document.getElementById('routeInfo').classList.remove('visible');
        }

        // Clicking the map itself, away from any marker, drops the selection.
        map.on('click', () => {
            if (selection) clearSelection();
        });

        // Fetch and display route shape
        async function drawRoute(vehicle) {
            try {
                // The compact format returns [lat, lon] pairs directly; the
                // default response is the verbose one kept for old app builds.
                const params = new URLSearchParams({ format: 'compact' });
                if (Number.isFinite(vehicle.lat) && Number.isFinite(vehicle.lon)) {
                    params.set('lat', vehicle.lat);
                    params.set('lon', vehicle.lon);
                }
                // The heading is what tells the two directions of a line apart.
                // Without it the server answers with whichever variant happens
                // to be nearer, and the route drawn is the one going the other
                // way — with the wrong terminus named on it.
                if (Number.isFinite(vehicle.heading)) params.set('heading', Math.round(vehicle.heading));

                const response = await fetch(`/shapes/${encodeURIComponent(vehicle.line)}?${params}`);
                if (!response.ok) {
                    throw new Error(`Failed to fetch route shape (${response.status})`);
                }

                const data = await response.json();
                const points = data.points || [];
                if (!points.length) throw new Error('Route has no shape points');

                hideRoute();

                const colour = Colors[vehicle.type] || Colors.unknown;
                currentRoute = L.layerGroup().addTo(map);

                // Two lines, one route: the part already travelled stays for
                // context but recedes, so what is left reads as what is left.
                const behind = L.polyline([], { color: colour, weight: 4, opacity: 0.25, lineJoin: 'round' })
                    .addTo(currentRoute);
                const ahead = L.polyline(points, { color: colour, weight: 4, opacity: 0.9, lineJoin: 'round' })
                    .addTo(currentRoute);

                const stops = new Map();
                for (const stop of data.stops || []) {
                    const dot = L.circleMarker([stop.lat, stop.lon], {
                        radius: 4,
                        color: colour,
                        fillColor: '#fff',
                        fillOpacity: 1,
                        weight: 2
                    }).addTo(currentRoute);
                    // The stop's own name only: the time in the shape payload
                    // belongs to the sample trip it was described from, not to
                    // the vehicle you just clicked.
                    dot.bindTooltip(escapeHtml(stop.name), { direction: 'top' });
                    stops.set(String(stop.id), dot);
                }

                routeLayers = { ahead, behind, stops, points, colour };
                if (selection) selection.shapeId = data.shapeId ?? null;
                map.fitBounds(ahead.getBounds(), { padding: [30, 30] });

            } catch (error) {
                console.error('Error fetching route shape:', error);
            }
        }

        /** Split the drawn route at the vehicle, and mark the stop it is heading for. */
        function applyProgress(trip) {
            if (!routeLayers) return;

            const onSameVariant = trip && selection && trip.shapeId === selection.shapeId;
            const index = onSameVariant && Number.isFinite(trip.shapeIndex)
                ? Math.min(Math.max(trip.shapeIndex, 0), routeLayers.points.length - 1)
                : null;

            routeLayers.behind.setLatLngs(index === null ? [] : routeLayers.points.slice(0, index + 1));
            routeLayers.ahead.setLatLngs(index === null ? routeLayers.points : routeLayers.points.slice(index));

            const nextId = trip?.nextStop ? String(trip.nextStop.id) : null;
            for (const [id, dot] of routeLayers.stops) {
                const isNext = id === nextId;
                dot.setStyle({
                    radius: isNext ? 7 : 4,
                    weight: isNext ? 3 : 2,
                    fillColor: isNext ? routeLayers.colour : '#fff'
                });
            }
        }

        /** The stops still ahead of the selected vehicle, and how late it is. */
        async function refreshTrip() {
            if (!selection) return;

            try {
                const response = await fetch(`/vehicle/${encodeURIComponent(selection.id)}`);
                if (response.status === 404) {
                    // Tracked vehicles time out; say so rather than showing a
                    // stop list that stopped being true minutes ago.
                    selection.stale = true;
                    selection.trip = null;
                } else if (response.ok) {
                    const data = await response.json();
                    selection.trip = data.trip;
                    selection.stale = false;
                    applyProgress(data.trip);
                } else {
                    throw new Error('HTTP ' + response.status);
                }
            } catch (error) {
                console.error('Error fetching vehicle trip:', error);
            }

            renderVehiclePanel();
        }

        function delayText(trip) {
            if (!trip || trip.delaySeconds === null || trip.delaySeconds === undefined) {
                return 'Rozkład tego kursu nieznany';
            }
            const minutes = Math.round(trip.delaySeconds / 60);
            if (minutes >= 1) return 'Spóźniony ' + minutes + ' min';
            if (minutes <= -1) return 'Przed czasem ' + Math.abs(minutes) + ' min';
            return 'Zgodnie z rozkładem';
        }

        function stopRow(stop, passed) {
            const minutes = Math.round((stop.etaSeconds ?? 0) / 60);
            const ago = Math.round((stop.agoSeconds ?? 0) / 60);
            const when = passed
                ? '<span class="stop-ago">' + (ago <= 0 ? 'przed chwilą' : ago + ' min temu') + '</span>'
                : '<span class="stop-eta">' + (minutes <= 0 ? 'teraz' : minutes + '<i>min</i>') + '</span>';

            return '<div class="stop-row' + (passed ? ' passed' : '') + '">' +
                '<span class="stop-dot"></span>' +
                '<span class="stop-name">' + escapeHtml(stop.name) +
                (stop.scheduled ? '<i>' + escapeHtml(stop.scheduled.slice(0, 5)) + '</i>' : '') +
                '</span>' + when + '</div>';
        }

        // Show the selected vehicle's panel
        function renderVehiclePanel() {
            const panel = document.getElementById('routeInfo');
            if (!selection) {
                panel.classList.remove('visible');
                return;
            }

            // The detail if it has arrived, otherwise the summary /locations
            // already carries — both name the destination and the next stop.
            const vehicle = vehicleData.find(entry => entry.id === selection.id);
            const trip = selection.trip || vehicle?.trip || null;
            const colour = Colors[selection.type] || Colors.unknown;

            const badge = document.getElementById('routeBadge');
            badge.textContent = selection.line;
            badge.style.background = colour;
            panel.style.color = colour;

            document.getElementById('routeTitle').textContent =
                trip?.towards ? '→ ' + trip.towards : 'Linia ' + selection.line;
            // The full "A → B" when we know it; the vehicle's category is only
            // a fallback, since "Tramwaje" says nothing about this vehicle.
            document.getElementById('routeType').textContent =
                trip?.direction || translations[selection.type]?.name || selection.type;

            const status = selection.stale
                ? '<span class="warn">Pojazd przestał nadawać</span>'
                : '<span>' + escapeHtml(delayText(trip)) + '</span>';
            const where = trip?.atStop
                ? 'Na przystanku ' + trip.atStop.name
                : trip?.previousStop ? 'Minął ' + trip.previousStop.name : '';
            document.getElementById('routeStatus').innerHTML =
                status + (where ? '<span class="muted">' + escapeHtml(where) + '</span>' : '');

            const rows = (trip?.previousStops || []).map(stop => stopRow(stop, true))
                .concat((trip?.nextStops || []).map(stop => stopRow(stop, false)));

            document.getElementById('routeStops').innerHTML = rows.length
                ? rows.join('')
                : '<div class="route-empty">' + (trip && trip.onRoute === false
                    ? 'Pojazd jest poza trasą, więc nie znamy kolejnych przystanków.'
                    : 'Brak danych o kolejnych przystankach.') + '</div>';

            panel.classList.add('visible');
        }

        // Hide route
        function hideRoute() {
            if (currentRoute) {
                map.removeLayer(currentRoute);
                currentRoute = null;
            }
            routeLayers = null;
        }

        // Create line selection interface
        function createLineFilters(lines) {
            const container = document.getElementById('filtersContainer');
            container.innerHTML = '';
            
            Object.keys(lines)
                .filter(cat => !['allBuses', 'allTrams'].includes(cat) && lines[cat].length > 0)
                .forEach(category => {
                    const categoryDiv = document.createElement('div');
                    categoryDiv.className = 'category-container';
                    
                    const title = document.createElement('div');
                    title.className = 'category-title';
                    title.textContent = translations[category]?.name || category;
                    categoryDiv.appendChild(title);
                    
                    const linesRow = document.createElement('div');
                    linesRow.className = 'lines-row';
                    
                    lines[category]
                        .sort((a, b) => parseInt(a) - parseInt(b))
                        .forEach(line => {
                            const lineButton = document.createElement('div');
                            lineButton.className = 'line-button';
                            lineButton.style.backgroundColor = Colors[category] || Colors.unknown;
                            lineButton.textContent = line;
                            lineButton.dataset.line = line;
                            
                            lineButton.addEventListener('click', () => {
                                toggleLineSelection(line, lineButton);
                            });
                            
                            linesRow.appendChild(lineButton);
                        });
                    
                    categoryDiv.appendChild(linesRow);
                    container.appendChild(categoryDiv);
                });
        }

        // Toggle line selection
        function toggleLineSelection(line, buttonElement) {
            const index = selectedLines.indexOf(line);
            if (index > -1) {
                selectedLines.splice(index, 1);
                buttonElement.classList.remove('selected');
            } else {
                selectedLines.push(line);
                buttonElement.classList.add('selected');
            }
            renderVehicles();
            renderAlerts();
        }

        // Update statistics
        function updateStats() {
            const visible = visibleVehicles();
            const tramCount = visible.filter(v => v.type.startsWith('tram')).length;
            const busCount = visible.filter(v => v.type.startsWith('bus')).length;

            document.getElementById('tramCount').textContent = tramCount;
            document.getElementById('busCount').textContent = busCount;
        }

        /** The line index, or null when the payload is not that. */
        function normaliseLines(payload) {
            if (!payload || typeof payload !== 'object' || Array.isArray(payload)) return null;

            const lines = {};
            for (const [key, value] of Object.entries(payload)) {
                if (Array.isArray(value)) lines[key] = value;
            }
            return Object.keys(lines).length ? lines : null;
        }

        /**
         * Fetch lines data.
         *
         * The server answers 503 with `{error, state}` for up to a minute after
         * boot while it ingests the feed. Reading that body as the line index
         * threw on the first `.sort()` and left the page stuck on "Ładowanie
         * pojazdów…" forever — so the payload is checked, and a cold start is
         * waited out instead of failed.
         */
        async function fetchLines(attempt = 0) {
            try {
                const response = await fetch('/lines');
                const payload = response.ok ? normaliseLines(await response.json()) : null;
                if (payload) {
                    createLineFilters(payload);
                    return;
                }
                throw new Error(response.ok ? 'unexpected payload' : 'HTTP ' + response.status);
            } catch (error) {
                if (attempt >= 5) {
                    console.error('Error fetching lines:', error);
                    return;
                }
                setTimeout(() => fetchLines(attempt + 1), Math.min(2000 * (attempt + 1), 8000));
            }
        }

        // Fetch vehicle locations
        async function fetchVehicles() {
            try {
                const response = await fetch('/locations');
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();

                vehicleData = (data.locations || []).filter(v =>
                    v.lat !== 0 && v.lon !== 0 && !isNaN(v.lat) && !isNaN(v.lon)
                );

                renderVehicles();

                // The vehicle being followed has moved, so where it is on its
                // route and when it reaches the stops ahead have both changed.
                if (selection) {
                    if (vehicleData.some(entry => entry.id === selection.id)) refreshTrip();
                    else {
                        selection.stale = true;
                        renderVehiclePanel();
                    }
                }

                if (data.lastUpdated) {
                    const lastUpdate = new Date(data.lastUpdated);
                    document.getElementById('lastUpdate').textContent = lastUpdate.toLocaleTimeString();
                }
                
                document.getElementById('loading').style.display = 'none';
                
            } catch (error) {
                console.error('Error fetching vehicles:', error);
                document.getElementById('loading').innerHTML = `
                    <div style="color: #E85D75;">
                        ❌ Błąd ładowania pojazdów
                    </div>
                `;
            }
        }

        // Service alerts
        let alertsData = [];

        function alertAge(timestamp) {
            const minutes = Math.floor((Date.now() - timestamp) / 60000);
            if (!Number.isFinite(minutes)) return '';
            if (minutes < 1) return 'teraz';
            if (minutes < 60) return minutes + ' min temu';
            if (minutes < 1440) return Math.floor(minutes / 60) + ' godz. temu';
            return Math.floor(minutes / 1440) + ' dni temu';
        }

        function renderAlerts() {
            const list = document.getElementById('alertsList');
            const count = document.getElementById('alertsCount');

            // An alert about a line you are not watching is noise; one about a
            // line on screen is the reason you looked at the panel.
            // With nothing selected the map shows every line, so every alert
            // is relevant; otherwise only the ones you are watching.
            const relevant = (alert) =>
                selectedLines.length === 0 ||
                (alert.affected || []).some((line) => selectedLines.includes(line));

            const sorted = [...alertsData].sort(
                (a, b) => (relevant(b) - relevant(a)) || (b.timestamp - a.timestamp));

            count.textContent = sorted.length;
            count.classList.toggle('zero', sorted.length === 0);

            if (!sorted.length) {
                list.innerHTML = '<div class="alerts-empty">Brak aktualnych utrudnień.</div>';
                return;
            }

            list.innerHTML = sorted.map((alert) => {
                const badges = (alert.affected || []).slice(0, 10).map((line) => {
                    const colour = Colors[(alert.types || {})[line]] || Colors.unknown;
                    return '<span class="alert-line" style="background:' + colour + '">' +
                        escapeHtml(line) + '</span>';
                }).join('');

                const body = [escapeHtml(alertAge(alert.timestamp))]
                    .concat(alert.content && alert.content !== alert.title
                        ? [escapeHtml(alert.content.slice(0, 140))] : [])
                    .join(' · ');

                return '<a class="alert-item' + (relevant(alert) ? ' relevant' : '') + '"' +
                    (alert.url ? ' href="' + escapeHtml(alert.url) + '" target="_blank" rel="noopener"' : '') +
                    '><div class="alert-title">' + escapeHtml(alert.title || alert.content) + '</div>' +
                    '<div class="alert-meta">' + body + '</div>' +
                    (badges ? '<div class="alert-lines">' + badges + '</div>' : '') +
                    '</a>';
            }).join('');
        }

        async function fetchAlerts() {
            try {
                const response = await fetch('/alerts');
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                alertsData = Array.isArray(data.alerts) ? data.alerts : [];
            } catch (error) {
                console.error('Error fetching alerts:', error);
                // Keep whatever was already on screen rather than blanking it.
            }
            renderAlerts();
        }

        // Initialize app
        async function initApp() {
            // Positions do not wait on the line list: the map is useful before
            // the filters are, and on a cold start the list retries on its own.
            fetchLines();
            await fetchVehicles();
            await fetchAlerts();

            // A tab nobody is looking at does not need ten-second updates, and
            // catches up the moment it comes back.
            setInterval(() => { if (!document.hidden) fetchVehicles(); }, 10000);
            setInterval(() => { if (!document.hidden) fetchAlerts(); }, 5 * 60000);
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) fetchVehicles();
            });
        }

        // Start the application
        initApp();

        // Reached from the panel's close button.
        window.clearSelection = clearSelection;
    </script>
</body>
</html>
