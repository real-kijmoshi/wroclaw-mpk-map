<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status — Wrocław MPK API</title>
<style>
  :root {
    --bg: #0b1020;
    --surface: #151b2e;
    --surface-2: #1e2740;
    --text: #f5f7fb;
    --muted: #93a0bd;
    --ok: #37d67a;
    --warn: #f5a623;
    --bad: #e85d75;
    --accent: #0075ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 4px rgba(55, 214, 122, 0.18); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 0 4px rgba(245, 166, 35, 0.18); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 0 4px rgba(232, 93, 117, 0.18); }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .card { background: var(--surface); border-radius: 14px; padding: 16px 18px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  .value { font-size: 28px; font-weight: 700; }
  .value small { font-size: 13px; font-weight: 500; color: var(--muted); }
  .card .sub { margin: 4px 0 0; }
  section { margin-top: 26px; }
  section > h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 14px; overflow: hidden; }
  th, td { text-align: left; padding: 11px 16px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,.06); }
  th { color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  code { background: var(--surface-2); padding: 2px 6px; border-radius: 5px; font-size: 12px; word-break: break-all; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.ok { background: rgba(55,214,122,.16); color: var(--ok); }
  .pill.bad { background: rgba(232,93,117,.16); color: var(--bad); }
  .err { background: rgba(232,93,117,.12); color: var(--bad); padding: 12px 16px; border-radius: 12px; }
  footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
  a { color: var(--accent); }
  .wrap { max-width: 980px; margin: 0 auto; }
</style>
</head>
<body>
<div class="wrap">
  <header><span class="dot" id="dot"></span><h1>Wrocław MPK API</h1></header>
  <div class="sub" id="subtitle">Łączenie…</div>
  <div id="content"></div>
  <footer>
    Odświeżanie co 10 s ·
    <a href="/map">mapa</a> ·
    <a href="/health">/health</a> ·
    <a href="/">lista endpointów</a>
  </footer>
</div>

<script>
  // Served by the API itself, so a relative URL always points at the right
  // host. This page used to hardcode http://localhost:3000 and stayed blank
  // anywhere else.
  const API_BASE = '';

  const escapeHtml = (value) =>
    String(value ?? '').replace(/[<>&"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));

  const ago = (iso) => {
    if (!iso) return 'nigdy';
    const seconds = Math.round((Date.now() - Date.parse(iso)) / 1000);
    if (!Number.isFinite(seconds)) return 'nigdy';
    if (seconds < 60) return seconds + ' s temu';
    if (seconds < 3600) return Math.round(seconds / 60) + ' min temu';
    if (seconds < 86400) return Math.round(seconds / 3600) + ' godz. temu';
    return Math.round(seconds / 86400) + ' dni temu';
  };

  const duration = (seconds) => {
    if (!Number.isFinite(seconds)) return '—';
    const d = Math.floor(seconds / 86400);
    const h = Math.floor((seconds % 86400) / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    return [d && d + 'd', h && h + 'h', m + 'm'].filter(Boolean).join(' ');
  };

  const card = (title, value, note) =>
    '<div class="card"><h2>' + escapeHtml(title) + '</h2><div class="value">' + value + '</div>' +
    (note ? '<div class="sub">' + note + '</div>' : '') + '</div>';

  const render = (health) => {
    const vehiclesFresh = Boolean(health.vehicles.lastSuccessAt) &&
      Date.now() - Date.parse(health.vehicles.lastSuccessAt) < 60000;
    const gtfsReady = health.gtfs.state === 'ready';

    document.getElementById('dot').className =
      'dot ' + (!gtfsReady ? 'bad' : vehiclesFresh ? 'ok' : 'warn');
    document.getElementById('subtitle').textContent =
      (gtfsReady ? 'Rozkłady wczytane' : 'Rozkłady niedostępne') +
      ' · pojazdy ' + (vehiclesFresh ? 'aktualne' : 'nieaktualne') +
      ' · uptime ' + duration(health.uptimeSeconds);

    const counts = health.gtfs.counts || {};
    const providers = health.alerts.providers || [];

    document.getElementById('content').innerHTML =
      '<div class="grid">' +
        card('Śledzone pojazdy', health.vehicles.tracked ?? 0, ago(health.vehicles.lastSuccessAt)) +
        card('Linie', health.lines.total, health.lines.trams + ' tramwajowych · ' + health.lines.buses + ' autobusowych') +
        card('Przystanki', counts.stops ?? '—', (counts.variants ?? '—') + ' wariantów tras') +
        card('Pamięć', (health.memoryMb ?? 0) + '<small> MB</small>', health.shapeCacheEntries + ' tras w cache') +
      '</div>' +

      '<section><h2>Źródła danych</h2><div class="scroll"><table>' +
        '<tr><th>Źródło</th><th>Adres</th><th>Ostatni sukces</th><th>Status</th></tr>' +
        '<tr><td>Rozkłady GTFS</td>' +
          '<td><code>' + escapeHtml(health.gtfs.source ?? '—') + '</code></td>' +
          '<td>' + ago(health.gtfs.fetchedAt) + '</td>' +
          '<td><span class="pill ' + (gtfsReady ? 'ok' : 'bad') + '">' +
            escapeHtml(health.gtfs.state) + (health.gtfs.fromCache ? ' (cache)' : '') + '</span></td></tr>' +
        '<tr><td>Pozycje pojazdów</td>' +
          '<td><code>' + escapeHtml(health.vehicles.source ?? '—') + '</code>' +
            (health.vehicles.encoding ? ' <code>' + escapeHtml(health.vehicles.encoding) + '</code>' : '') + '</td>' +
          '<td>' + ago(health.vehicles.lastSuccessAt) + '</td>' +
          '<td><span class="pill ' + (vehiclesFresh ? 'ok' : 'bad') + '">' +
            escapeHtml(vehiclesFresh ? 'ok' : (health.vehicles.lastError ?? 'brak danych')) + '</span></td></tr>' +
        providers.map((provider) =>
          '<tr><td>Komunikaty</td>' +
            '<td><code>' + escapeHtml(provider.name) + '</code></td>' +
            '<td>' + ago(provider.lastSuccessAt) + '</td>' +
            '<td><span class="pill ' + (provider.lastError ? 'bad' : 'ok') + '">' +
              escapeHtml(provider.lastError ?? provider.items + ' pozycji') + '</span></td></tr>').join('') +
      '</table></div></section>' +

      (health.gtfs.error
        ? '<section><div class="err">Ostatni błąd GTFS: ' + escapeHtml(health.gtfs.error) + '</div></section>'
        : '') +

      '<section><h2>Zbudowany indeks</h2><div class="scroll"><table>' +
        '<tr><th>Trasy</th><th>Warianty</th><th>Kursy</th><th>Odjazdy</th><th>Kształty</th><th>Czas budowy</th></tr>' +
        '<tr><td>' + (counts.routes ?? '—') + '</td>' +
          '<td>' + (counts.variants ?? '—') + '</td>' +
          '<td>' + (counts.trips ?? 0).toLocaleString('pl-PL') + '</td>' +
          '<td>' + (counts.stopTimes ?? 0).toLocaleString('pl-PL') + '</td>' +
          '<td>' + (counts.shapes ?? '—') + '</td>' +
          '<td>' + (health.gtfs.buildMs ?? '—') + ' ms</td></tr>' +
      '</table></div></section>';
  };

  const refresh = async () => {
    try {
      // /health answers 503 while the timetable is still loading, and the body
      // is exactly the report this page wants to show.
      const response = await fetch(API_BASE + '/health');
      render(await response.json());
    } catch (error) {
      document.getElementById('dot').className = 'dot bad';
      document.getElementById('subtitle').textContent = 'Brak połączenia z API';
      document.getElementById('content').innerHTML =
        '<div class="err">' + escapeHtml(error.message) + '</div>';
    }
  };

  refresh();
  setInterval(refresh, 10000);
</script>
</body>
</html>
