# One-click deploy on Render. `render.yaml` lives here so the service's root
# directory is the server folder.
#
# The free tier sleeps after 15 minutes of inactivity and reloads the whole
# GTFS feed on wake, which takes about a minute — fine for a hobby deployment,
# but pick a paid instance if you want the app to feel instant.
services:
  - type: web
    name: wroclaw-mpk-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # The timetable index is the memory-hungry part; turn this off if the
      # instance runs out of memory.
      - key: GTFS_BUILD_STOP_INDEX
        value: 'true'
      # Render terminates TLS at its own router, so without this every request
      # arrives with the router's address: the rate limit would see the whole
      # internet as one client and the usage stats would count one visitor.
      - key: TRUST_PROXY
        value: 'true'
      # @AlertMPK through Nitter is the only alerts source by design. Public
      # mirrors refuse requests without notice (nitter.net answers 429 under a
      # five-minute poll), and a mirror that is down reads as zero posts rather
      # than a crash — so keep more than one here as they become available.
      # `/health` reports the reason under alerts.providers[].lastError.
      - key: NITTER_INSTANCE_URLS
        sync: false
      # Enables /admin. Without it the dashboard routes are not registered at
      # all, which is why the deployed API answers 404 there. Set in the Render
      # dashboard — `sync: false` keeps the value out of this file.
      - key: ADMIN_TOKEN
        sync: false
    disk:
      name: gtfs-cache
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
