name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

  wroclive:
    name: Mobile app (wroclive)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wroclive
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wroclive/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # Bundling for web exercises every import and the Expo config without
      # needing an Android or iOS toolchain.
      - name: Bundle
        run: npx expo export --platform web --output-dir dist

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t wroclaw-mpk-api ./server
